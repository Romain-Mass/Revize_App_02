<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="/assets/icons/Revize.svg" />
		<title>Insciption</title>
		<link rel="stylesheet" href="../Styles/styles2.css" />
	</head>
	<body>
		<header>
			<nav aria-label="Navigation principale">
				<div>
					<img src="../assets/icons/Revize.svg" alt="Icon" />
					<a href="#accueil" id="Revize" aria-label="Retour à l'accueil">
						Revize
					</a>
				</div>
			</nav>
		</header>
		<main>
			<form>
				<h2>Créer un compte</h2>
				<div class="form">
					<label>
						Prénom
						<input
							autocomplete="given-name"
							type="text"
							name="firstName"
							id="firstName"
							placeholder="Thomas"
							required
						/>
					</label>
					<label>
						EMAIL
						<input
							autocomplete="off"
							type="text"
							name="email"
							id="email"
							placeholder="toto@test.fr"
							required
						/>
					</label>
					<label>
						Password
						<input
							autocomplete="current-password"
							type="password"
							name="password"
							id="password"
							placeholder="Entrer un mot de passe"
							required
						/>
					</label>
				</div>
				<button type="submit">S'inscrire</button>
				<a href="/pages/connexion.html">Déjà un compte ?</a>
			</form>
		</main>
		<script src="./JS/storage.js" defer></script>
		<script src="./JS/inscris.js" defer></script>
	</body>
</html>
